# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse (resize panes, select windows)
set -g mouse on

set -g history-limit 10000

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes
bind | split-window -h
bind - split-window -v

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Faster escape key (important for vim)
set -sg escape-time 10

# Better colors
set -g default-terminal "tmux-256color"

set-option -g set-clipboard on

##### COLORS (COSMIC STYLE) #####
# background
set -g status-bg "#1e1e2e"
set -g status-fg "#cdd6f4"

# inactive window
setw -g window-status-format " #[fg=#6c7086]#I:#W "

# active window
setw -g window-status-current-format " #[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

# pane borders
set -g pane-border-style fg="#313244"
set -g pane-active-border-style fg="#89b4fa"

##### STATUS BAR #####
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
# set -g status-right-length 80

# left side
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]|"

# right side
# set -g status-right "#[fg=#6c7086]#H #[fg=#89b4fa]| #[fg=#cdd6f4]%Y-%m-%d #[fg=#89b4fa]| #[fg=#cdd6f4]%H:%M "

##### MESSAGE STYLE #####
set -g message-style bg="#89b4fa",fg="#1e1e2e"

##### PANE NUMBER DISPLAY #####
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#6c7086"

##### WINDOW SEPARATOR #####
set -g window-status-separator ""

